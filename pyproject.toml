[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkcf"
version = "2024.01.00"
description = "CMakeLists.txt generator for Fortran/C scientific code"
readme = "docs/mkcf.md"
license = {text = "GPL-2.0-or-later"}
authors = [
    {name = "NOAA-GFDL", email = "gfdl.climate.model.info@noaa.gov"}
]
maintainers = [
    {name = "NOAA-GFDL", email = "gfdl.climate.model.info@noaa.gov"}
]
keywords = [
    "fortran",
    "cmake",
    "build-system",
    "scientific-computing",
    "hpc",
    "makefile",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "black",
    "flake8",
    "mypy",
    "isort",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme",
    "sphinx-click",
]

[project.scripts]
mkcf = "mkcf:main"

[project.urls]
Homepage = "https://github.com/NOAA-GFDL/mkmf"
Documentation = "https://github.com/NOAA-GFDL/mkmf/blob/main/docs/mkcf.md"
Repository = "https://github.com/NOAA-GFDL/mkmf"
Issues = "https://github.com/NOAA-GFDL/mkmf/issues"

[tool.setuptools]
py-modules = []
packages = []

[tool.setuptools.package-data]
"*" = ["*.mk"]

[tool.pytest.ini_options]
testpaths = ["t"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mkcf"]
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["bin"]
omit = ["*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
